<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Discount Calculator</title>
</head>

<body>
  <div class="container">
    <div class="calculator">
      <div class="header">
        discount calculator
      </div>
      <div class="form">
        <label for="bill" class="input-group">
          <p>Bill Amount</p>
          <input type="number" id="bill">
        </label>
        <label for="percentage" class="input-group">
          <p>Discount percentage</p>
          <input type="number" id="percentage">
        </label>

        <button class="Calculate" onclick="calculateddiscount()">Calculate discount</button>
      </div>

      <div class="result-box">
        <div class="result-discount" id="result-discount">
          <p>Your Discount Will Appear Here</p>
        </div>
        <div class="result-total" id="result-total">
          <p>Your Total Will Appear Here</p>
        </div>
      </div>
    </div>
  </div>





  <script src="script.js"></script>
</body>

</html>
